import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import com.github.jengelman.gradle.plugins.shadow.transformers.Log4j2PluginsCacheFileTransformer
import com.github.jengelman.gradle.plugins.shadow.transformers.PropertiesFileTransformer

plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}
group 'sunnyslopes.fortressfinder'
version '1.0.6'

/*
 * Native contract with the FortressFinderBase submodule:
 *
 *   FortressFinderBase owns every line of C++/cubiomes code.
 *   :fortressfinderbase:copyNativeArtifacts -> build/native/fortressFinderLibJ.dll
 *   :fortressfinderbase:copyCliArtifact     -> build/cli/fortressfinder-cli.exe
 *
 * The Java side only depends on the JNI signatures in FortressFinderBridge
 * and on the DLL produced by the subproject.  cubiomes is a nested submodule
 * of FortressFinderBase; the main module never compiles or checks out its own
 * cubiomes copy.
 */

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
}

test {
    useJUnitPlatform()
}

// buildMainJar below is the single fat-JAR task. The plugin's default
// shadowJar would otherwise write the same archive name during `gradlew build`.
tasks.named('shadowJar') {
    enabled = false
}

// Keep the plain Java jar out of the deliverable name; buildMainJar owns
// build/libs/FortressFinder-<version>.jar.
tasks.named('jar') {
    archiveClassifier.set('thin')
}

def generatedNativeResourcesDir = layout.buildDirectory.dir('generated/native-resources')
def baseNativeDir = project(':fortressfinderbase').layout.buildDirectory.dir('native')
def baseCliExe = file('FortressFinderBase/build/cli/fortressfinder-cli.exe')
def mainPackageDir = layout.buildDirectory.dir('cli')

def resolveJavac() {
    def candidates = []
    def javaHome = System.getenv('JAVA_HOME')
    if (javaHome) {
        candidates << new File(javaHome, 'bin/javac.exe')
        candidates << new File(javaHome, 'bin/javac')
    }
    def runtimeHome = System.getProperty('java.home')
    if (runtimeHome) {
        candidates << new File(runtimeHome, 'bin/javac.exe')
        candidates << new File(runtimeHome, 'bin/javac')
    }
    def path = System.getenv('PATH')
    if (path) {
        path.split(File.pathSeparator).each { dir ->
            candidates << new File(dir, 'javac.exe')
            candidates << new File(dir, 'javac')
        }
    }
    def found = candidates.find { it.isFile() }
    if (found == null) {
        throw new GradleException('javac not found. Set JAVA_HOME to a JDK 17+ directory.')
    }
    return found
}

/*
 * Fails fast when the submodule is not connected.  Building the JAR without
 * FortressFinderBase/cubiomes would otherwise fail later inside MSYS2 with a
 * much less obvious message.
 */
def checkFortressBaseSubmodule = tasks.register('checkFortressBaseSubmodule') {
    group = 'verification'
    description = 'Verifies FortressFinderBase and its nested cubiomes submodule are initialized'
    doLast {
        def required = [
                'FortressFinderBase/build.gradle',
                'FortressFinderBase/fortress_finder.cpp',
                'FortressFinderBase/fortress_finder.h',
                'FortressFinderBase/fortress_cli.cpp',
                'FortressFinderBase/Thread.h',
                'FortressFinderBase/build_jni_msys2.ps1',
                'FortressFinderBase/build_cli_msys2.ps1',
                'FortressFinderBase/jni/CMakeLists.txt',
                'FortressFinderBase/jni/sunnyslopes_fortressfinder_FortressFinderBridge.cpp',
                'FortressFinderBase/jni/generated/sunnyslopes_fortressfinder_FortressFinderBridge.h',
                'FortressFinderBase/.gitmodules',
                'FortressFinderBase/cubiomes/finders.c'
        ]
        def missing = required.findAll { !file(it).exists() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    'FortressFinderBase submodule is not initialized correctly. Missing: '
                            + missing.join(', ')
                            + '. Run: git submodule update --init --recursive')
        }

        if (!file('FortressFinderBase/.gitmodules').text.contains('cubiomes')) {
            throw new GradleException(
                    'FortressFinderBase/.gitmodules does not declare the nested cubiomes submodule. '
                            + 'Update FortressFinderBase and run: git -C FortressFinderBase submodule update --init --recursive')
        }
    }
}

/*
 * The Java bridge is the source of truth for the JNI signatures.  Regenerate
 * the header and compare it with the checked-in copy in the submodule so the
 * two sides cannot drift apart silently.
 */
def verifyJniContract = tasks.register('verifyJniContract') {
    group = 'verification'
    description = 'Checks FortressFinderBridge.java against the JNI header owned by FortressFinderBase'
    def bridgeJava = file('src/main/java/sunnyslopes/fortressfinder/FortressFinderBridge.java')
    def baseHeader = file('FortressFinderBase/jni/generated/sunnyslopes_fortressfinder_FortressFinderBridge.h')
    def contractDir = layout.buildDirectory.dir('generated/jni-contract')
    inputs.file(bridgeJava)
    inputs.file(baseHeader)
    outputs.dir(contractDir)
    doLast {
        def outDir = contractDir.get().asFile
        delete(outDir)
        outDir.mkdirs()
        def classesDir = new File(outDir, 'classes')
        classesDir.mkdirs()
        def javac = resolveJavac()
        exec {
            commandLine javac.absolutePath, '-encoding', 'UTF-8',
                    '-d', classesDir.absolutePath,
                    '-h', outDir.absolutePath,
                    bridgeJava.absolutePath
        }
        def generated = new File(outDir, 'sunnyslopes_fortressfinder_FortressFinderBridge.h')
        if (!generated.exists()) {
            throw new GradleException("javac did not produce ${generated}")
        }
        def normalize = { File f ->
            f.getText('UTF-8').readLines()
                    .collect { it.replaceAll(/\s+$/, '') }
                    .findAll { !it.trim().isEmpty() }
                    .join('\n')
        }
        if (normalize(generated) != normalize(baseHeader)) {
            throw new GradleException(
                    'JNI contract drift: FortressFinderBridge.java and '
                            + 'FortressFinderBase/jni/generated/'
                            + 'sunnyslopes_fortressfinder_FortressFinderBridge.h differ. '
                            + 'Copy the regenerated header into FortressFinderBase.')
        }
    }
}

// Give the missing-submodule error a chance to run before the header check.
verifyJniContract.configure { dependsOn checkFortressBaseSubmodule }

tasks.register('prepareNativeResources') {
    group = 'build'
    description = 'Collects the FortressFinderBase JNI DLL into jar resources'
    dependsOn checkFortressBaseSubmodule, verifyJniContract
    dependsOn ':fortressfinderbase:copyNativeArtifacts'
    inputs.files(baseNativeDir).optional()
    outputs.dir(generatedNativeResourcesDir)
    doLast {
        def outDir = generatedNativeResourcesDir.get().asFile
        delete(outDir)
        outDir.mkdirs()

        def nativeDir = baseNativeDir.get().asFile
        def dll = new File(nativeDir, 'fortressFinderLibJ.dll')
        if (!dll.exists()) {
            throw new GradleException(
                    "Native DLL missing after :fortressfinderbase:copyNativeArtifacts: ${dll}. "
                            + 'Check the MSYS2 build output above.')
        }
        copy {
            from(dll)
            into(new File(outDir, 'native/windows'))
        }
        copy {
            from(nativeDir)
            include('*.so')
            into(new File(outDir, 'native/linux'))
        }
        copy {
            from(nativeDir)
            include('*.dylib')
            into(new File(outDir, 'native/macos'))
        }
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('prepareNativeResources')
    from(generatedNativeResourcesDir)
}

// Creates the fat JAR for FortressFinder (native DLL embedded via processResources).
tasks.register('buildMainJar', ShadowJar) {
    group = 'build'
    description = 'Creates a fat JAR for FortressFinder with the FortressFinderBase DLL'
    archiveBaseName.set('FortressFinder')
    archiveClassifier.set('')
    dependsOn classes, processResources
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
    manifest {
        attributes 'Main-Class': 'sunnyslopes.fortressfinder.FortressFinderFrame'
        attributes 'Multi-Release': 'true'
    }
    mergeServiceFiles()
    transform(Log4j2PluginsCacheFileTransformer)
    transform(PropertiesFileTransformer) {
        paths = ['META-INF/spring.handlers', 'META-INF/spring.schemas']
        mergeStrategy = "append"
    }
    exclude 'module-info.class'
}

tasks.register('buildNative') {
    group = 'build'
    description = 'Builds fortressFinderLibJ.dll via the FortressFinderBase subproject'
    dependsOn checkFortressBaseSubmodule, verifyJniContract
    dependsOn ':fortressfinderbase:copyNativeArtifacts'
}

tasks.register('buildNativeCli') {
    group = 'build'
    description = 'Builds the standalone fortressfinder-cli.exe via the FortressFinderBase subproject'
    dependsOn checkFortressBaseSubmodule
    dependsOn ':fortressfinderbase:copyCliArtifact'
}

// Keeps the main module's own copy of the CLI next to the JAR.
tasks.register('collectNativeCli', Copy) {
    group = 'build'
    description = 'Copies fortressfinder-cli.exe into build/cli'
    dependsOn buildNativeCli
    from baseCliExe
    into mainPackageDir
    doFirst {
        if (!baseCliExe.exists()) {
            throw new GradleException(
                    "Standalone CLI missing after :fortressfinderbase:copyCliArtifact: ${baseCliExe}")
        }
    }
}

tasks.register('buildDistribution') {
    group = 'build'
    description = 'One-shot: check submodule → JNI contract → DLL + fat JAR + standalone CLI (no zip)'
    dependsOn buildMainJar, collectNativeCli
}

tasks.register('buildAllJars') {
    group = 'build'
    description = 'Alias of buildDistribution'
    dependsOn buildDistribution
}

tasks.named('build') {
    dependsOn buildDistribution
}

['checkFortressBaseSubmodule', 'verifyJniContract', 'prepareNativeResources', 'buildNative',
 'buildNativeCli', 'collectNativeCli', 'compileJava', 'processResources', 'buildMainJar'].each { taskName ->
    tasks.named(taskName).configure { mustRunAfter clean }
}
